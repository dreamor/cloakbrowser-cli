name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist artifacts
        run: |
          test -f dist/cli.js || { echo "::error::dist/cli.js missing"; exit 1; }
          test -f dist/cli.d.ts || { echo "::error::dist/cli.d.ts missing"; exit 1; }
          echo "Build artifacts verified"

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install CloakBrowser binary
        run: npx cloakbrowser install || echo "::warning::CloakBrowser binary install skipped"
      - name: Install Playwright browsers
        run: npx playwright-core install chromium || echo "::warning::Playwright chromium install skipped"
      - run: npm run test:e2e
        env:
          CI: true
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Check for console.log
        run: |
          matches=$(grep -rn 'console\.log' src/ --include='*.ts' || true)
          if [ -n "$matches" ]; then
            echo "::error::Found console.log in source code"
            echo "$matches"
            exit 1
          fi
          echo "No console.log found"
      - name: Check for hardcoded secrets
        run: |
          matches=$(grep -rnE '(api_key|apikey|secret|password|token|auth_token)\s*[:=]\s*["'"'"'][^"'"'"']+["'"'"']' src/ --include='*.ts' -i || true)
          if [ -n "$matches" ]; then
            echo "::error::Potential hardcoded secret found"
            echo "$matches"
            exit 1
          fi
          echo "No hardcoded secrets found"

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [typecheck, build, unit-tests, e2e-tests, lint]
    environment: release
    permissions:
      id-token: write
      contents: read
    outputs:
      published_version: ${{ steps.resolve-version.outputs.RESOLVED_VERSION }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --version && npm --version
      - run: npm install -g npm@latest
      - run: node --version && npm --version
      - run: npm ci
      - name: Resolve version (bump if already published)
        id: resolve-version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION="${TAG_VERSION}"

          while npm view "@dreamor/cloakbrowser-cli@${VERSION}" version >/dev/null 2>&1; do
            echo "⚠️ Version ${VERSION} already published on npm, bumping patch..."
            VERSION=$(node -e "
              const p = '${VERSION}'.split('.');
              const patch = parseInt(p[2] || '0', 10);
              console.log(p[0] + '.' + p[1] + '.' + (patch + 1));
            ")
          done

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "📋 Auto-bumped: ${TAG_VERSION} → ${VERSION}"
            npm version "$VERSION" --no-git-tag-version
          else
            echo "✅ Version ${VERSION} is available, no bump needed"
          fi

          echo "RESOLVED_VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - run: npm publish --access public --provenance

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: |
          PUBLISHED="${{ needs.publish-npm.outputs.published_version }}"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION="${PUBLISHED:-$TAG_VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Extract changelog
        id: changelog
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          section=$(sed -n "/## \[${version}\]/,/## \[/p" CHANGELOG.md | head -n -1 | tail -n +2)
          echo "BODY<<EOF" >> "$GITHUB_OUTPUT"
          echo "$section" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.BODY }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
