name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release once started: cancelling mid-publish could leave
  # npm updated while the GitHub Release step never runs.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    name: Verify CI & Publish to npm
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    outputs:
      published_version: ${{ steps.resolve-version.outputs.RESOLVED_VERSION }}
    steps:
      - uses: actions/checkout@v5

      # Typecheck/build/tests/lint run once in the CI workflow on the same
      # commit. Tagging may happen right after pushing main, so poll until
      # the CI run for this SHA completes instead of failing on the race.
      - name: Wait for CI passed and verify for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_WAIT_SECONDS: '1200'
          POLL_INTERVAL: '30'
        run: |
          # Guard against GITHUB_SHA being the annotated tag object: resolve to
          # the commit the tag points to, fall back to GITHUB_SHA if local
          # rev-parse can't deref it (shallow checkout).
          SHA="$(git rev-parse "${GITHUB_SHA}^{commit}" 2>/dev/null || echo "${GITHUB_SHA}")"

          check_ci() {
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}" \
              --jq 'if .total_count == 0 then "none none" else .workflow_runs[0].status + " " + (.workflow_runs[0].conclusion // "pending") end'
          }

          elapsed=0
          ci_status="none"
          ci_conclusion="pending"
          while [ "${elapsed}" -lt "${MAX_WAIT_SECONDS}" ]; do
            read -r ci_status ci_conclusion <<<"$(check_ci || true)"
            echo "CI for ${SHA}: ${ci_status:-none}/${ci_conclusion:-pending} (waited ${elapsed}s)"
            if [ "${ci_status}" = "completed" ]; then
              break
            fi
            sleep "${POLL_INTERVAL}"
            elapsed=$((elapsed + POLL_INTERVAL))
          done

          if [ "${ci_status}" = "completed" ] && [ "${ci_conclusion}" = "success" ]; then
            echo "✅ CI passed for ${SHA}"
          else
            echo "::error::CI for commit ${SHA} is '${ci_status:-none}/${ci_conclusion:-pending}' after waiting ${elapsed}s, refusing to publish."
            echo "::error::Check https://github.com/${GITHUB_REPOSITORY}/actions/workflows/ci.yml — likely a red CI run on main."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --version && npm --version
      - run: npm ci
      - name: Resolve version (bump if already published)
        id: resolve-version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION="${TAG_VERSION}"

          while npm view "@dreamor/cloakbrowser-cli@${VERSION}" version >/dev/null 2>&1; do
            echo "⚠️ Version ${VERSION} already published on npm, bumping patch..."
            VERSION=$(node -e "
              const p = '${VERSION}'.split('.');
              const patch = parseInt(p[2] || '0', 10);
              console.log(p[0] + '.' + p[1] + '.' + (patch + 1));
            ")
          done

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "📋 Auto-bumped: ${TAG_VERSION} → ${VERSION}"
            npm version "$VERSION" --no-git-tag-version
          else
            echo "✅ Version ${VERSION} is available, no bump needed"
          fi

          echo "RESOLVED_VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - run: npm publish --access public --provenance

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish-npm]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: |
          PUBLISHED="${{ needs.publish-npm.outputs.published_version }}"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION="${PUBLISHED:-$TAG_VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Extract changelog
        id: changelog
        run: |
          version="${{ steps.version.outputs.VERSION }}"

          section=$(sed -n "/## \[${version}\]/,/## \[/p" CHANGELOG.md | head -n -1 | tail -n +2)

          {
            echo "BODY<<EOF"
            echo "$section"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.BODY }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
